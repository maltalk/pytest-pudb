[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-pudb"
version = "0.7.0"
description = "Pytest PuDB debugger integration"
readme = "README.rst"
license = "MIT"
authors = [{name = "Michael Elovskikh", email = "wronglink@gmail.com"}]
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0",
    "pudb",
]
keywords = ["pytest", "pudb", "debugger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/maltalk/pytest-pudb"
Repository = "https://github.com/maltalk/pytest-pudb"
Issues = "https://github.com/maltalk/pytest-pudb/issues"

[project.entry-points.pytest11]
pudb = "pytest_pudb"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pexpect",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pexpect",
    "ruff",
]

[tool.setuptools]
py-modules = ["pytest_pudb"]

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0",
    "pexpect",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args:test_pytest_pudb.py}"

[[tool.hatch.env.test.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.lint]
dependencies = [
    "ruff",
]

[tool.hatch.envs.lint.scripts]
check = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = [".venv", "venv", "env"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by ruff formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pytest_pudb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
